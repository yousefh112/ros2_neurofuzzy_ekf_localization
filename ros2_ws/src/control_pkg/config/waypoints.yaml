# Trajectory Controller — Waypoints Configuration
#
# All indoor waypoint transitions use cardinal-only (90°) movements.
# Diagonal transitions increase heading uncertainty during GPS-denied phases
# and produce more varied ANN training trajectories.
#
# ================================================================
# BUILDING GEOMETRY
# ================================================================
# 6 rooms: 3 south (below E-W divider walls) + 3 north (above E-W divider walls)
#
#  ┌──────────────┬────────────────┬──────────────┐
#  │  North-West  │  North-Center  │  North-East  │
#  │  [Door A2 ↕] │  Accessible:   │  [Door B2 ↕] │
#  │  [Door C2 ←→]│  via C2 & C1   │  [Door C1 ←→]│
#  ├──────────────┼────────────────┼──────────────┤
#  │  South-West  │  South-Center  │  South-East  │
#  │  [Door A ←→] │  [MAIN ENTRY ↕]│  [Door B ←→] │
#  └──────────────┴────────────────┴──────────────┘
#
#  Legend:  ←→ = E-W crossing (through a N-S vertical wall)
#            ↕  = N-S crossing (through an E-W horizontal wall)
#
# ================================================================
# ALL DOORS — EXACT WORLD FRAME COORDINATES (SDF-verified)
# ================================================================
# South entry  (outer S wall ↕):  x_c= 0.161  y_wall=-4.149  x∈[-0.536,+0.858]
# Door A  (N-S wall west  ←→):   x_wall=-3.501  y_c=-3.466  y∈[-3.916,-3.016]
# Door B  (N-S wall east  ←→):   x_wall=+3.849  y_c=-3.430  y∈[-3.880,-2.980]
# Door A2 (E-W wall west   ↕):   y_wall=+0.211  x_c=-4.741  x∈[-5.191,-4.291]
# Door B2 (E-W wall east   ↕):   y_wall=+0.201  x_c=+4.705  x∈[+4.255,+5.155]
# Door C2 (N-S upper west ←→):   x_wall=-3.510  y_c=+0.902  y∈[+0.452,+1.352]
# Door C1 (N-S upper east ←→):   x_wall=+3.840  y_c=+0.866  y∈[+0.416,+1.316]
# Wall_1  (E-W center SOLID):     y_wall=+0.201  x∈[-3.576,+3.924]  ← NEVER CROSS
#
# ================================================================
# SAFE CROSSING RULES (violations = guaranteed crash)
# ================================================================
# N-S WEST wall (x≈-3.50):
#   south half → cross ONLY at y∈[-3.916,-3.016]  (Door A)
#   north half → cross ONLY at y∈[+0.452,+1.352]  (Door C2)
#   ❌ ALL OTHER y VALUES = SOLID WALL
#
# N-S EAST wall (x≈+3.84):
#   south half → cross ONLY at y∈[-3.880,-2.980]  (Door B)
#   north half → cross ONLY at y∈[+0.416,+1.316]  (Door C1)
#   ❌ ALL OTHER y VALUES = SOLID WALL
#
# E-W EAST wall  (y≈+0.201): cross ONLY at x∈[+4.255,+5.155]  (Door B2)
# E-W WEST wall  (y≈+0.211): cross ONLY at x∈[-5.191,-4.291]  (Door A2)
# E-W CENTER     (y≈+0.201, x∈[-3.576,+3.924]): Wall_1 — NEVER CROSS
#
# IMPORTANT: North-half N-S walls are SOLID above y≈+1.352.
#   The old rule "y > +0.28 is safe" was WRONG and has been removed.
#
# ================================================================
# CRASH ROOT CAUSE (confirmed from rosbag, run 4):
#   Old WP (6.50, 0.90) required crossing Wall_12 at x=6.50 — SOLID WALL.
#   Door B2 x_center=4.705 is 1.8m WEST of x=6.50.
#   Fix: approach Door B2 perpendicularly, x=4.705 going north (↕).
#
# ================================================================
# DOOR CROSSING PROTOCOL
# ================================================================
# Every door crossing has three waypoints:
#   1. PRE-APPROACH  : same side, 0.50m from wall, at door center
#   2. DOOR          : the wall crossing point
#   3. POST-CROSS    : opposite side, 0.50m from wall, at door center
#
# This ensures the robot aligns with the door center BEFORE reaching
# the wall, tolerating indoor localization errors up to ~0.45m.
#
# Offsets used:
#   Door A  (x_wall=−3.501): east pre=−3.00, west post=−4.00
#   Door B  (x_wall=+3.849): west pre=+3.35, east post=+4.35
#   Door A2 (y_wall=+0.211): south pre=−0.30, north post=+0.70
#   Door B2 (y_wall=+0.201): south pre=−0.30, north post=+0.70
#   Door C2 (x_wall=−3.510): east pre=−3.01, west post=−4.01
#
# ================================================================
# SOUTH ENTRY x=0.16 RATIONALE
# ================================================================
# GPS ENU frame has a systematic x-offset from /odom: dx = −0.441 ± 0.151m
# (map_x = odom_x + dx_gps). South entry waypoints use map x=0.16 so that
# the robot crosses in /odom at x≈+0.16 (door center), with safe margins
# across the full ±2σ GPS offset range.
#
# NORTH CLEARANCE waypoints after each indoor entry drive the robot north
# before turning east/west, avoiding collision with the south wall jambs
# caused by the GPS x-offset during the initial geofence transition.
# ================================================================

