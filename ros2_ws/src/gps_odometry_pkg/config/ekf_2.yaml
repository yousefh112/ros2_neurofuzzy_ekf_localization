# navsat_transform2 is unused dead config. system.launch.py intentionally omits
# this node — two navsat_transform instances on the same /odometry/gps topic
# cause a race condition that corrupts GPS→ENU for both EKFs.
navsat_transform2:
  ros__parameters:
      frequency: 30.0
      delay: 3.0
      magnetic_declination_radians: 0.0
      yaw_offset: 0.0
      zero_altitude: true
      broadcast_utm_transform: true
      publish_filtered_gps: true
      use_odometry_yaw: true
      wait_for_datum: false
      datum: [45.0500, 7.6600, 0.0]